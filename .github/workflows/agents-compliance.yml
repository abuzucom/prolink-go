name: AGENTS.md Compliance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agents-compliance:
    # Pinned to the abuzucom/agents commit adopted by this repository.
    uses: abuzucom/agents/.github/workflows/agents-compliance.yml@d5e040e7736fbdcd67f4d3d43db0650789630452
