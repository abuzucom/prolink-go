name: AGENTS.md Policy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Install checker dependencies
        run: python -m pip install --requirement requirements-checkers.txt
      - name: Run policy tests
        run: python scripts/run_tests.py

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Install checker dependencies
        run: python -m pip install --requirement requirements-checkers.txt
      - name: Check synchronized copies
        run: python scripts/sync.py --check
      - name: Check the shared gate files against the manifest
        run: python scripts/sync.py --check-shared
      - name: Run style lint
        run: python scripts/lint_style.py
      - name: Check worktree conflict markers
        run: python scripts/check_conflict_markers.py
      - name: Check no untested statement entered the hooks
        run: python scripts/check_hook_coverage.py
      - name: Check dashes and ASCII in repository prose
        run: >-
          python scripts/check_ascii.py
          README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md
          docs/template-drift.md plan/HANDOFF.md
          .github/PULL_REQUEST_TEMPLATE.md .github/ISSUE_TEMPLATE.md
      - name: Check American spelling (warning only)
        run: >-
          python scripts/check_us_spelling.py
          AGENTS.md README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md
          docs/template-drift.md plan/HANDOFF.md
          .github/PULL_REQUEST_TEMPLATE.md .github/ISSUE_TEMPLATE.md
      - name: Check English only (warning only)
        run: >-
          python scripts/check_english_only.py
          AGENTS.md README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md
          docs/template-drift.md plan/HANDOFF.md
          .github/PULL_REQUEST_TEMPLATE.md .github/ISSUE_TEMPLATE.md
      - name: Check prose policy (warning only)
        run: >-
          python scripts/check_hedging.py
          AGENTS.md CHANGELOG.md CONTRIBUTING.md SECURITY.md
          docs/template-drift.md plan/HANDOFF.md
          .github/PULL_REQUEST_TEMPLATE.md .github/ISSUE_TEMPLATE.md
