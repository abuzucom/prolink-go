name: build
on: [push]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # actions/setup-go v7.0.0, Node 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ^1.13

      - name: golangci-lint
        # golangci/golangci-lint-action v9.3.0, Node 24
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893

      - name: Build
        run: go build cmd/status-reciever/main.go
